name: verify

on:
  pull_request:
  push:
    branches: [main]

# Read-only: this workflow proves the suite; it never writes to the repo.
permissions:
  contents: read

# Superseded runs on the same ref are cancelled so only the latest head is proven.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so verify.py's diff-check can resolve the merge-base and
          # examine the branch's committed changes, not just the working tree.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt -r requirements-dev.txt
      - name: Verify
        run: python bin/verify.py

  # Single stable required check. Branch protection requires "verify / verify";
  # add more jobs to `needs` later without changing the required name.
  verify:
    runs-on: ubuntu-latest
    needs: [unittest]
    if: always()
    steps:
      - name: Aggregate required results
        run: |
          if [ "${{ needs.unittest.result }}" != "success" ]; then
            echo "verify failed: unittest=${{ needs.unittest.result }}"
            exit 1
          fi
          echo "all required jobs passed"
