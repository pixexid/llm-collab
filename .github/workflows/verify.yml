name: verify

# Manual escape hatch ONLY. Verify is a LOCAL gate (bin/verify.py); this workflow
# has no automatic triggers, so it consumes no Actions minutes per PR. Dispatch it
# by hand for dependency/environment drift or incident reproduction — a dispatched
# run is supplementary evidence, never the merge gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so verify.py's diff-check can resolve the merge-base.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt -r requirements-dev.txt
      - name: Verify
        run: python bin/verify.py
